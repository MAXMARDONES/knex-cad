<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1160 470' width='1160' height='470' role='img'><title>K'NEX joint types</title><rect width='1160' height='470' fill='#FFFFFF'/><text x='14' y='28' font-family='IBM Plex Mono, Menlo, monospace' font-size='19' font-weight='700' fill='#151915'>The three joints, and what each one lets move</text><rect x='14' y='60' width='1132' height='80' fill='none' stroke='#CBD0C6'/><text x='30' y='86' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' font-weight='700' fill='#E8531A'>end-on</text><text x='30' y='106' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#5C665C'>rod tip pushed into a socket</text><text x='250' y='86' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#151915'>RIGID. no rotation, no slide. the joint the whole lattice is built from.</text><text x='250' y='106' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#5C665C'>rod tip sits 10 mm from the hub centre, so c2c = rod length + 20</text><circle cx='1010' cy='100' r='16' fill='none' stroke='#151915' stroke-width='2'/><rect x='1018' y='96' width='60' height='8' rx='3' fill='#2563D9' stroke='#151915'/><rect x='14' y='152' width='1132' height='80' fill='none' stroke='#CBD0C6'/><text x='30' y='178' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' font-weight='700' fill='#E8531A'>hub (through-hole)</text><text x='30' y='198' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#5C665C'>rod passes through the centre hole</text><text x='250' y='178' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#151915'>FREE AXLE. spins about the rod and slides along it. this is the only real bearing.</text><text x='250' y='198' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#5C665C'>park it with spacers (3.1 blue / 9.3 silver) and stop it with a cap</text><circle cx='1044' cy='192' r='16' fill='none' stroke='#151915' stroke-width='2'/><rect x='996' y='188' width='96' height='8' rx='3' fill='#2563D9' stroke='#151915'/><path d='M1044 166 a 26 26 0 0 1 22 13' fill='none' stroke='#E8531A' stroke-width='2'/><rect x='14' y='244' width='1132' height='80' fill='none' stroke='#CBD0C6'/><text x='30' y='270' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' font-weight='700' fill='#E8531A'>side-on</text><text x='30' y='290' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#5C665C'>socket bites the rod's ridge</text><text x='250' y='270' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#151915'>PIVOT WITH FRICTION about the rod axis; slides along it if pushed hard.</text><text x='250' y='290' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#5C665C'>only on ridges (every 8.9 mm) of white and longer. never on a green rod</text><rect x='996' y='280' width='96' height='8' rx='3' fill='#2563D9' stroke='#151915'/><circle cx='1044' cy='310' r='16' fill='none' stroke='#151915' stroke-width='2'/><line x1='1044' y1='294' x2='1044' y2='288' stroke='#151915' stroke-width='6'/><rect x='14' y='336' width='1132' height='80' fill='none' stroke='#CBD0C6'/><text x='30' y='362' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' font-weight='700' fill='#E8531A'>3D pair</text><text x='30' y='382' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#5C665C'>two 3D connectors slotted together</text><text x='250' y='362' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#151915'>RIGID, planes locked at 90 deg. the only way to turn a corner in all three axes.</text><text x='250' y='382' font-family='IBM Plex Mono, Menlo, monospace' font-size='12.5' fill='#5C665C'>blue/blue leaves 2 hard positions, blue/grey 1: build the rod in before mating</text><circle cx='1038' cy='376' r='16' fill='none' stroke='#151915' stroke-width='2'/><ellipse cx='1038' cy='376' rx='5' ry='16' fill='none' stroke='#151915' stroke-width='2'/><text x='14' y='458' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5C665C'>every joint in a .knx build is inferred from geometry: put the parts where they go and the checker names the joint</text></svg>